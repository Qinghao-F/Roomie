<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fffaf3">
  <meta name="description" content="Roomie — 更轻松的合租生活。">
  <title>Roomie · 即将上线</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#fffaf3;color:#29241f}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 18% 14%,rgba(255,196,123,.34),transparent 33rem),radial-gradient(circle at 85% 80%,rgba(122,175,155,.28),transparent 31rem),#fffaf3}
    main{width:min(680px,calc(100% - 40px));padding:clamp(36px,8vw,72px);border:1px solid rgba(68,57,44,.12);border-radius:32px;background:rgba(255,255,255,.76);box-shadow:0 24px 80px rgba(73,58,41,.10);backdrop-filter:blur(18px)}
    .mark{width:54px;height:54px;display:grid;place-items:center;border-radius:18px;background:#29241f;color:#fffaf3;font-size:25px;box-shadow:0 10px 24px rgba(41,36,31,.18)}
    p{margin:0}.eyebrow{margin-top:36px;color:#8b6844;font-size:13px;font-weight:750;letter-spacing:.14em;text-transform:uppercase}
    h1{margin:12px 0 18px;font-size:clamp(44px,10vw,78px);line-height:.98;letter-spacing:-.055em}
    .intro{max-width:470px;color:#696058;font-size:clamp(16px,3vw,20px);line-height:1.75}
    .status{margin-top:36px;display:inline-flex;align-items:center;gap:10px;padding:10px 14px;border-radius:999px;background:#f4eee6;color:#695849;font-size:13px;font-weight:650}
    .dot{width:8px;height:8px;border-radius:50%;background:#5c9b79;box-shadow:0 0 0 5px rgba(92,155,121,.13)}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">R</div>
    <p class="eyebrow">Roomie</p>
    <h1>让合租，<br>更合拍。</h1>
    <p class="intro">一个为室友共同生活打造的小管家。房租、账单、家务和那些容易忘记的小事，很快都会在这里变得简单。</p>
    <p class="status"><span class="dot" aria-hidden="true"></span>正在认真搭建中</p>
  </main>
</body>
</html>
